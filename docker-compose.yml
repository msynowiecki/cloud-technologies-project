services:

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    networks:
      - proxy-net
    depends_on:
      backend_1:
        condition: service_started
      backend_2:
        condition: service_started
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf

  backend_1:
    build:
      context: ./backend
    environment:
      INSTANCE_ID: backend_1
      BACKEND_PORT: ${BACKEND_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy-net
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json

  backend_2:
    build:
      context: ./backend
    environment:
      INSTANCE_ID: backend_2
      BACKEND_PORT: ${BACKEND_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy-net
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    environment:
      WORKER: "true"
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - db-net

networks:
  proxy-net:
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

  app-net:
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1

  db-net:
    ipam:
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1

volumes:
  postgres-data:
  redis-data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt

configs:
  nginx_config:
    file: ./frontend/nginx/default.conf
  app_config:
    file: ./backend/app.config.json