services:

  nginx:
    image: nginx:latest
    networks:
      - app-net
      - proxy-net
    depends_on:
      - backend_1
      - backend_2
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  backend_1:
    build:
      context: ./backend
    image: backend:${APP_VERSION:-latest}
    pull_policy: build
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      INSTANCE_ID: backend_1
      BACKEND_PORT: ${BACKEND_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    restart: unless-stopped

  backend_2:
    build:
      context: ./backend
    image: backend:${APP_VERSION:-latest}
    pull_policy: build
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      INSTANCE_ID: backend_2
      BACKEND_PORT: ${BACKEND_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    image: worker:${APP_VERSION:-latest}
    pull_policy: build
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      WORKER: "true"
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  adminer:
    image: adminer
    profiles: [debug]
    networks:
      - db-net

  pgadmin:
    image: dpage/pgadmin4
    profiles: [debug]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - db-net

  db-migrator:
    image: alpine
    profiles: [migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["sh", "-c", "echo Running migrations && sleep 5 && echo Done"]

networks:
  proxy-net:
  app-net:
  db-net:

volumes:
  postgres-data:
  redis-data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt

configs:
  app_config:
    file: ./backend/app.config.json